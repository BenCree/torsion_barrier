[belief]

# --------------------------------------------------------------------------
# The espaloma-encoder arm. Registered 2026-09-13 before it ran, while the
# DPA3 arms were the only ones that existed. The head is unchanged; only the
# representation swaps.

[[datasets]]
id = "per_molecule_espaloma"
origin = "computed"
files = ["data/per_molecule_espaloma.csv"]
title = "The torsion head on espaloma's graph embedding, one row per molecule and arm"

[[variables]]
dataset = "per_molecule_espaloma"
name = "molecule_id"
unit = "dimensionless"
description = "The resampling unit."

[[variables]]
dataset = "per_molecule_espaloma"
name = "rmse"
unit = "kcal/mol"
description = "Profile RMSE against QM, each relative to its own minimum."

[[variables]]
dataset = "per_molecule_espaloma"
name = "rmse_flat"
unit = "kcal/mol"
description = "The flat-profile control, a function of the QM scan alone."

[[relationships]]
id = "E1_the_graph_embedding_carries_the_torsion"
x = "per_molecule_espaloma.predicted_barrier_kcal_mol"
y = "per_molecule_espaloma.qm_barrier_kcal_mol"
kind = "correlation"
method = "pearson"
claimed = 0.85
resampling_unit = "molecule_id"
evidence.source = """THE PREDICTION, written before the arm ran. espaloma 0.4.0
reaches 1.18 kcal/mol on TorsionNet500 with a torsion readout whose phase is
fixed to {0, pi}, so its graph embedding demonstrably carries torsion chemistry;
this head fits the phase continuously on top of that same embedding and should
therefore track the barrier at least as well as the DPA3 arm does. 0.85 is
claimed rather than 0.9 because the embedding is 512 features against DPA3's
128 and the Janossy layer is four times wider on the same training set, which
is a capacity change in the wrong direction for 604 molecules. Refuted downward
means a graph network trained to emit MM parameters does not transfer to a
phase head, and the pretrained atomistic descriptor was the right choice after
all."""
evidence.locator = "data/per_molecule_espaloma.csv :: predicted_barrier_kcal_mol, qm_barrier_kcal_mol"

[[relationships]]
id = "K5_the_espaloma_join_is_intact"
x = "per_molecule_espaloma.rmse_flat"
y = "per_molecule_espaloma.qm_barrier_kcal_mol"
kind = "correlation"
method = "spearman"
claimed = 0.95
resampling_unit = "molecule_id"
evidence.source = """THE KNOWN ANSWER. Both columns come from the QM scan alone,
so they are monotone in each other by construction and this must return near 1.
It is what says a low E1 is a real null rather than a row mismatch between the
espaloma graph build and the cached geometries, which is a live risk because the
graph is built from connectivity while the profile comes from coordinates."""
evidence.locator = "data/per_molecule_espaloma.csv :: rmse_flat, qm_barrier_kcal_mol"
